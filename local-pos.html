<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yul POS — 결제</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── 공통 변수 ── */
        :root {
            --mint:        #fdff94;
            --mint-dark:   #f5f700;
            --mint-light:  #feffd4;
            --yellow:      #ffe082;
            --yellow-dark: #ffd54f;
            --bg:          #f4f6f8;
            --white:       #ffffff;
            --border:      #e2e6ea;
            --text:        #1e2329;
            --text-sub:    #6b7684;
            --danger:      #ef4444;
            --danger-light:#fee2e2;
            --success:     #10b981;
            --success-light:#d1fae5;
            --radius:      12px;
            --radius-sm:   8px;
            --radius-lg:   16px;
            --shadow-sm:   0 1px 4px rgba(0,0,0,0.06);
            --shadow:      0 2px 12px rgba(0,0,0,0.08);
            --shadow-md:   0 4px 20px rgba(0,0,0,0.10);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg); color: var(--text);
            font-size: 14px; -webkit-font-smoothing: antialiased;
            height: 100dvh;
            overflow: hidden; display: flex; flex-direction: column;
        }
        /* 버튼 */
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; transition: all .15s; white-space: nowrap; }
        .btn:active { transform: scale(.97); }
        .btn-ghost { background: var(--bg); color: var(--text-sub); }
        .btn-ghost:hover { background: var(--border); }
        .btn-mint  { background: var(--mint); color: var(--text); }
        .btn-mint:hover { background: var(--mint-dark); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        /* 헤더 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 24px; height: 56px; background: var(--white); border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); flex-shrink: 0; }
        .top-bar-title { font-size: 1.1rem; font-weight: 700; }
        /* 스크롤바 */
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .main-container {
            display: flex; gap: 16px; padding: 16px;
            flex: 1; overflow: hidden;
            min-height: 0;
        }

        /* 좌측 상품 — 비율 5 */
        .product-section {
            flex: 5; display: flex; flex-direction: column;
            gap: 12px; min-width: 0; min-height: 0; overflow: hidden;
        }

        #category-nav { display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }

        .cat-btn {
            padding: 7px 18px; border: 1.5px solid var(--border);
            border-radius: 20px; background: var(--white);
            cursor: pointer; font-family: inherit; font-size: 13px;
            font-weight: 600; color: var(--text-sub); transition: all .15s;
        }
        .cat-btn:hover { border-color: var(--mint-dark); color: var(--text); }
        .cat-btn.active { background: var(--yellow); border-color: var(--yellow-dark); color: var(--text); }

        #product-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 12px; overflow-y: auto; align-content: start;
            flex: 1; padding-bottom: 4px;
        }
        #product-grid::-webkit-scrollbar { width: 5px; }
        #product-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .product-card {
            background: var(--white); border: 1.5px solid var(--border);
            border-radius: var(--radius); overflow: hidden; cursor: pointer;
            display: flex; flex-direction: column;
            transition: transform .15s, box-shadow .15s, border-color .15s;
            box-shadow: var(--shadow);
        }
        .product-card:hover:not(.sold-out-card) { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--mint-dark); }
        .product-card:active:not(.sold-out-card) { transform: translateY(0); }
        .sold-out-card { cursor: default; opacity: .85; }

        .product-img-wrap {
            width: 100%; aspect-ratio: 1/1; background: #f0f2f4;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .no-img-placeholder { color: #c8cdd3; font-size: 0.75rem; font-weight: 500; }

        .sold-out-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.38); display: flex; align-items: center; justify-content: center; }
        .sold-out-badge { background: #ff8a8a; color: white; padding: 5px 14px; border-radius: 20px; font-weight: 700; font-size: 0.82rem; }

        .product-info { padding: 10px 10px 11px; border-top: 1px solid var(--border); }
        .product-name { font-size: 0.82rem; color: var(--text-sub); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-price { font-size: 0.9rem; font-weight: 700; color: var(--text); }

        /* 우측 주문 — 비율 3 */
        .cart-section {
            flex: 3; flex-shrink: 0; background: var(--white);
            border-radius: var(--radius); padding: 20px 18px 18px;
            display: flex; flex-direction: column;
            box-shadow: var(--shadow-md); border: 1px solid var(--border);
            min-height: 0; overflow: hidden;
        }
        .cart-title { text-align: center; font-size: 1rem; font-weight: 700; margin-bottom: 14px; }
        .cart-labels { display: flex; font-size: 0.78rem; font-weight: 600; color: var(--text-sub); padding-bottom: 8px; border-bottom: 1.5px solid var(--border); margin-bottom: 2px; }

        #cart-items { flex: 1; overflow-y: auto; }
        #cart-items::-webkit-scrollbar { width: 4px; }
        #cart-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .cart-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f2f4; font-size: 0.88rem; }
        .cart-row-name { flex: 2; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
        .cart-row-qty { flex: 1.5; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .qty-btn { width: 22px; height: 22px; border: none; background: var(--mint); color: var(--text); border-radius: 5px; cursor: pointer; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: background .12s; }
        .qty-btn:hover { background: var(--mint-dark); }
        .qty-num { font-weight: 700; min-width: 16px; text-align: center; }
        .cart-row-price { flex: 1; text-align: right; font-weight: 600; font-size: 0.85rem; }

        .cart-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-sub); font-size: 0.85rem; }

        .cart-footer { margin-top: 10px; padding-top: 14px; border-top: 2px solid var(--text); }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .total-label { font-size: 0.95rem; font-weight: 600; }
        .total-amount { font-size: 1.15rem; font-weight: 700; }

        .pay-buttons { display: flex; gap: 8px; }
        .pay-btn { flex: 1; padding: 13px 0; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.9rem; background: var(--mint); color: var(--text); transition: background .15s, transform .1s; }
        .pay-btn:hover { background: var(--mint-dark); }
        .pay-btn:active { transform: scale(.97); }
        .extra-btn { width: 100%; margin-top: 8px; padding: 10px 0; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--white); cursor: pointer; font-family: inherit; font-weight: 600; font-size: 0.85rem; color: var(--text-sub); transition: all .15s; }
        .extra-btn:hover { border-color: var(--text-sub); color: var(--text); }

        /* 판매 외 기록 모달 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; overflow-y: auto; padding: 30px 16px; }
        .modal-content { background: var(--white); width: 100%; max-width: 480px; margin: 0 auto; padding: 28px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); animation: modalIn .2s ease; }
        @keyframes modalIn { from { opacity:0; transform: translateY(-12px) scale(.97); } to { opacity:1; transform: none; } }
        .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }

        .reason-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .reason-btn { padding: 10px 8px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--white); cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text-sub); transition: all .15s; text-align: center; }
        .reason-btn:hover { border-color: var(--text); color: var(--text); }
        .reason-btn.selected { background: var(--mint); border-color: var(--mint-dark); color: var(--text); }

        .nonsale-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 8px; }
        .nonsale-item-img { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; background: var(--border); flex-shrink: 0; }
        .nonsale-item-name { flex: 1; font-weight: 600; font-size: 13px; }
        .nonsale-qty-wrap { display: flex; align-items: center; gap: 8px; }
        .nonsale-qty-btn { width: 26px; height: 26px; border: none; background: var(--mint); border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .nonsale-qty-num { font-weight: 700; min-width: 20px; text-align: center; }

        .memo-input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; font-size: 13px; color: var(--text); resize: none; margin-bottom: 16px; transition: border-color .15s; }
        .memo-input:focus { outline: none; border-color: var(--mint-dark); }

        .modal-footer { display: flex; gap: 8px; }
        .modal-footer button { flex: 1; padding: 12px 0; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.9rem; }
        .btn-cancel { background: var(--bg); color: var(--text-sub); }
        .btn-confirm { background: var(--mint); color: var(--text); }

        /* 기록 내역 */
        .nonsale-log { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); flex-shrink: 0; max-height: 120px; overflow-y: auto; }
        .nonsale-log-title { font-size: 11px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
        .nonsale-log-item { font-size: 12px; color: var(--text-sub); padding: 4px 0; border-bottom: 1px solid #f0f2f4; display: flex; justify-content: space-between; gap: 8px; }
        .nonsale-log-item:last-child { border: none; }
        .log-reason-tag { padding: 1px 7px; border-radius: 10px; background: var(--bg); font-size: 11px; flex-shrink: 0; }
    </style>
</head>
<body>

<header class="top-bar">
    <button class="btn btn-ghost" id="btn-shops">🏪 부스 목록</button>
    <button class="btn btn-ghost" id="btn-inventory">상품 관리</button>
    <span id="shop-name-display" class="top-bar-title"></span>
    <div style="width:80px"></div>
</header>

<div class="main-container">
    <div class="product-section">
        <div id="category-nav"></div>
        <div id="product-grid"></div>
    </div>

    <div class="cart-section">
        <div class="cart-title">주문내역</div>
        <div class="cart-labels">
            <span style="flex:2">상품명</span>
            <span style="flex:1.5;text-align:center">수량</span>
            <span style="flex:1;text-align:right">가격</span>
        </div>
        <div id="cart-items"><div class="cart-empty">상품을 선택해 주세요.</div></div>
        <div class="cart-footer">
            <div class="total-row">
                <span class="total-label">합계</span>
                <span class="total-amount" id="total-price">0원</span>
            </div>
            <div class="pay-buttons">
                <button class="pay-btn" id="pay-cash">현금결제</button>
                <button class="pay-btn" id="pay-transfer">계좌이체</button>
            </div>
            <button class="extra-btn" id="btn-nonsale">📦 판매 외 기록</button>
        </div>
        <div class="nonsale-log" id="nonsale-log" style="display:none;">
            <div class="nonsale-log-title">판매 외 기록</div>
            <div id="nonsale-log-items"></div>
        </div>
    </div>
</div>

<!-- 판매 외 기록 모달 -->
<div id="modal-nonsale" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title">📦 판매 외 기록</div>

        <div style="font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;">사유 선택</div>
        <div class="reason-grid">
            <button class="reason-btn" data-reason="선물 / 나눔 / 사은품">🎁 선물 / 나눔 / 사은품</button>
            <button class="reason-btn" data-reason="파본 / 불량 / 교환">🔄 파본 / 불량 / 교환</button>
            <button class="reason-btn" data-reason="샘플 / 내부 사용">🖼️ 샘플 / 내부 사용</button>
            <button class="reason-btn" data-reason="분실 / 도난">🔍 분실 / 도난</button>
            <button class="reason-btn" data-reason="기타" style="grid-column:1/-1;">📝 기타</button>
        </div>

        <div style="font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;">상품 선택</div>
        <div id="nonsale-product-list" style="margin-bottom:14px;max-height:200px;overflow-y:auto;"></div>

        <textarea id="nonsale-memo" class="memo-input" rows="2" placeholder="메모 입력 (선택)"></textarea>

        <div class="modal-footer">
            <button class="btn-cancel" id="nonsale-cancel-btn">돌아가기</button>
            <button class="btn-confirm" id="nonsale-confirm-btn">기록 확정하기</button>
        </div>
    </div>
</div>

<script type="module">
import { shops, categories, products, sales, getShopId } from './local-storage.js';

const shopId = getShopId();
// ★ 헤더 버튼에서 참조할 수 있도록 window에 노출
window._posShopId = shopId;

let cart = [];
let allProducts = [];
let nonSaleItems = {};
let selectedReason = '';
let nonSaleLogs = [];

try {
    nonSaleLogs = JSON.parse(localStorage.getItem('yul_nonsale_logs') || '[]');
} catch (e) {
    nonSaleLogs = [];
}

// shopId 없으면 목록으로
if (!shopId) { location.href = './local-shops.html'; }

// ── 초기화 ──
function init() {
    const shop = shops.get(shopId);
    document.getElementById('shop-name-display').textContent = shop?.name || 'Yul POS';
    categories.init(shopId);
    loadProducts();
    renderNonSaleLog();
    bindEvents();
}

function bindEvents() {
    // 헤더 버튼 — addEventListener로 Safari 완벽 호환
    document.getElementById('btn-shops').addEventListener('click', () => {
        location.href = './local-shops.html';
    });
    document.getElementById('btn-inventory').addEventListener('click', () => {
        location.href = 'local-inventory.html?shopId=' + shopId;
    });

    // 결제 버튼
    document.getElementById('pay-cash').addEventListener('click', () => handlePayment('현금'));
    document.getElementById('pay-transfer').addEventListener('click', () => handlePayment('계좌이체'));

    // 판매 외 기록 버튼
    document.getElementById('btn-nonsale').addEventListener('click', openNonSaleModal);

    // 사유 버튼
    document.querySelectorAll('.reason-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.reason-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedReason = btn.dataset.reason;
        });
    });

    // 모달 확인/취소
    document.getElementById('nonsale-cancel-btn').addEventListener('click', closeNonSaleModal);
    document.getElementById('nonsale-confirm-btn').addEventListener('click', confirmNonSale);

    // 모달 바깥 클릭
    document.getElementById('modal-nonsale').addEventListener('click', function (e) {
        if (e.target === this) closeNonSaleModal();
    });
}

function loadProducts() {
    allProducts = products.list(shopId);
    const cats = ['전체', ...categories.list(shopId).map(c => c.name)];
    renderCategoryNav(cats);
    renderProducts(allProducts);
}

// ── 카테고리 ──
function renderCategoryNav(cats) {
    const nav = document.getElementById('category-nav');
    nav.innerHTML = cats.map((cat, i) => `
        <button class="cat-btn ${i === 0 ? 'active' : ''}" data-cat="${cat}">${cat}</button>
    `).join('');

    nav.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            nav.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const cat = btn.dataset.cat;
            const filtered = cat === '전체' ? allProducts : allProducts.filter(p => p.category === cat);
            renderProducts(filtered);
        });
    });
}

// ── 상품 렌더링 ──
function renderProducts(list) {
    const grid = document.getElementById('product-grid');
    if (list.length === 0) {
        grid.innerHTML = '<div style="color:var(--text-sub);padding:40px;text-align:center;grid-column:1/-1;">등록된 상품이 없습니다.<br>상품 관리에서 추가해주세요.</div>';
        return;
    }
    grid.innerHTML = list.map(p => {
        const isSoldOut = p.status === '품절';
        return `
        <div class="product-card ${isSoldOut ? 'sold-out-card' : ''}" data-product-id="${p.id}" data-sold-out="${isSoldOut}">
            <div class="product-img-wrap">
                ${p.imageUrl
                    ? `<img src="${p.imageUrl}" alt="${p.name}">`
                    : `<span class="no-img-placeholder">이미지 없음</span>`}
                ${isSoldOut ? `<div class="sold-out-overlay"><span class="sold-out-badge">품절</span></div>` : ''}
            </div>
            <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="product-price">${p.price.toLocaleString()}원</div>
            </div>
        </div>`;
    }).join('');

    // 상품 카드 클릭 — 이벤트 위임
    grid.querySelectorAll('.product-card:not(.sold-out-card)').forEach(card => {
        card.addEventListener('click', () => addToCart(card.dataset.productId));
    });
}

// ── 장바구니 ──
function addToCart(id) {
    const p = allProducts.find(p => p.id === id);
    if (!p) return;
    const existing = cart.find(c => c.id === id);
    if (existing) existing.quantity++;
    else cart.push({ id: p.id, name: p.name, price: p.price, quantity: 1 });
    renderCart();
}

function renderCart() {
    const el = document.getElementById('cart-items');
    if (cart.length === 0) {
        el.innerHTML = '<div class="cart-empty">상품을 선택해 주세요.</div>';
        document.getElementById('total-price').textContent = '0원';
        return;
    }
    el.innerHTML = cart.map((item, i) => `
        <div class="cart-row">
            <div class="cart-row-name">${item.name}</div>
            <div class="cart-row-qty">
                <button class="qty-btn" data-idx="${i}" data-delta="-1">−</button>
                <span class="qty-num">${item.quantity}</span>
                <button class="qty-btn" data-idx="${i}" data-delta="1">+</button>
            </div>
            <div class="cart-row-price">${(item.price * item.quantity).toLocaleString()}원</div>
        </div>
    `).join('');

    // 수량 버튼 이벤트
    el.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.idx);
            const delta = parseInt(btn.dataset.delta);
            cart[idx].quantity += delta;
            if (cart[idx].quantity <= 0) cart.splice(idx, 1);
            renderCart();
        });
    });

    const total = cart.reduce((s, c) => s + c.price * c.quantity, 0);
    document.getElementById('total-price').textContent = total.toLocaleString() + '원';
}

// ── 결제 ──
function handlePayment(method) {
    if (cart.length === 0) { alert('담긴 상품이 없습니다.'); return; }
    const total = cart.reduce((s, c) => s + c.price * c.quantity, 0);
    sales.addOrder(shopId, cart, method);
    alert('총 ' + total.toLocaleString() + '원 ' + method + ' 결제 완료!');
    cart = [];
    renderCart();
}

// ── 판매 외 기록 ──
function openNonSaleModal() {
    nonSaleItems = {};
    selectedReason = '';
    document.getElementById('nonsale-memo').value = '';
    document.querySelectorAll('.reason-btn').forEach(b => b.classList.remove('selected'));

    const list = document.getElementById('nonsale-product-list');
    const availableProducts = allProducts.filter(p => p.status !== '품절');

    if (availableProducts.length === 0) {
        list.innerHTML = '<div style="color:var(--text-sub);text-align:center;padding:20px;font-size:13px;">등록된 상품이 없습니다.</div>';
    } else {
        list.innerHTML = availableProducts.map(p => `
            <div class="nonsale-item">
                ${p.imageUrl
                    ? `<img class="nonsale-item-img" src="${p.imageUrl}">`
                    : `<div class="nonsale-item-img" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-sub);">없음</div>`}
                <span class="nonsale-item-name">${p.name}</span>
                <div class="nonsale-qty-wrap">
                    <button class="nonsale-qty-btn" data-pid="${p.id}" data-delta="-1">−</button>
                    <span class="nonsale-qty-num" id="nqty-${p.id}">0</span>
                    <button class="nonsale-qty-btn" data-pid="${p.id}" data-delta="1">+</button>
                </div>
            </div>
        `).join('');

        list.querySelectorAll('.nonsale-qty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const pid = btn.dataset.pid;
                const delta = parseInt(btn.dataset.delta);
                nonSaleItems[pid] = Math.max(0, (nonSaleItems[pid] || 0) + delta);
                document.getElementById('nqty-' + pid).textContent = nonSaleItems[pid];
            });
        });
    }

    document.getElementById('modal-nonsale').style.display = 'block';
}

function closeNonSaleModal() {
    document.getElementById('modal-nonsale').style.display = 'none';
}

function confirmNonSale() {
    if (!selectedReason) { alert('사유를 선택해주세요.'); return; }
    const selected = Object.entries(nonSaleItems).filter(([, qty]) => qty > 0);
    if (selected.length === 0) { alert('상품을 1개 이상 선택해주세요.'); return; }

    const memo = document.getElementById('nonsale-memo').value.trim();
    const now  = new Date().toISOString();

    const log = {
        id:     Date.now().toString(36),
        reason: selectedReason,
        memo,
        items:  selected.map(([id, qty]) => {
            const p = allProducts.find(p => p.id === id);
            return { productId: id, productName: p?.name || '?', qty };
        }),
        createdAt: now,
    };

    nonSaleLogs.unshift(log);
    localStorage.setItem('yul_nonsale_logs', JSON.stringify(nonSaleLogs));

    closeNonSaleModal();
    renderNonSaleLog();

    const summary = log.items.map(i => i.productName + ' ' + i.qty + '개').join(', ');
    showToast('📦 기록 완료: [' + selectedReason + '] ' + summary);
}

function renderNonSaleLog() {
    const wrap = document.getElementById('nonsale-log');
    const list = document.getElementById('nonsale-log-items');
    if (nonSaleLogs.length === 0) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    const fmtTime = iso => {
        const d = new Date(iso);
        return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    };
    list.innerHTML = nonSaleLogs.slice(0, 5).map(log => `
        <div class="nonsale-log-item">
            <span>${fmtTime(log.createdAt)} ${log.items.map(i => i.productName + ' ' + i.qty + '개').join(', ')}${log.memo ? ' · ' + log.memo : ''}</span>
            <span class="log-reason-tag">${log.reason}</span>
        </div>
    `).join('');
}

function showToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    Object.assign(t.style, {
        position:'fixed', bottom:'24px', left:'50%', transform:'translateX(-50%)',
        background:'#1a1d23', color:'white', padding:'12px 24px',
        borderRadius:'8px', fontWeight:'600', fontSize:'13px',
        boxShadow:'0 4px 20px rgba(0,0,0,0.3)', zIndex:'9999', whiteSpace:'nowrap'
    });
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

init();
</script>
</body>
</html>
