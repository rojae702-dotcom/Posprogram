<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yul POS</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #fdff94; display: flex; align-items: center; justify-content: center; height: 100dvh; flex-direction: column; gap: 12px; }
        .logo { font-size: 3.2rem; font-weight: 700; color: #1e2329; letter-spacing: -1px; animation: fadeIn .6s ease; }
        .sub { font-size: 1rem; color: #6b7684; animation: fadeIn .8s ease; }
        .dot-wrap { display: flex; gap: 8px; margin-top: 16px; animation: fadeIn 1s ease; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #1e2329; opacity: 0.25; animation: pulse 1.2s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
        @keyframes pulse { 0%,100% { opacity:.25; transform:scale(1); } 50% { opacity:1; transform:scale(1.3); } }
    </style>
</head>
<body>
    <div class="logo">Yul POS</div>
    <div class="sub">잠시만 기다려주세요</div>
    <div class="dot-wrap"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js', { scope: './' });
        setTimeout(() => { window.location.href = './local-shops.html'; }, 1500);
    </script>
</body>
</html>
